*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a22;font-family:'Bungee','Arial Black',sans-serif;color:#fff;touch-action:none}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px;pointer-events:auto}
.pill{display:flex;align-items:center;gap:7px;background:rgba(18,16,28,.58);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 14px 4px 8px;font-size:clamp(15px,3.2vmin,26px);text-shadow:0 2px 0 rgba(0,0,0,.4);backdrop-filter:blur(3px)}
.pill b{color:#ffe066;font-weight:400;min-width:1.6ch;text-align:right}
.coin{width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcf33 55%,#c98a00);border:2px solid #b87800;display:inline-block;position:relative}
.coin:after{content:'C';position:absolute;inset:0;display:grid;place-items:center;font-size:.7em;color:#9a6200}
.pill svg{width:1.35em;height:1.35em;fill:#7fd4ff}
#prog{flex:1;height:clamp(12px,2.4vmin,20px);background:rgba(18,16,28,.58);border:2px solid rgba(255,255,255,.2);border-radius:999px;position:relative;overflow:visible}
#progFill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff5a3c,#ffd23f)}
#prog i{position:absolute;right:-6px;top:50%;width:26px;height:26px;transform:translateY(-60%);background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0);background-size:100% 100%;border:3px solid #fff;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#hearts{display:flex;gap:4px}
.hrt{width:clamp(22px,4.4vmin,34px);height:auto;fill:#ff3b57;stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hrt.off{fill:#3a3a48;stroke:#777}
#banner{position:absolute;left:50%;top:30%;text-align:center;pointer-events:none;display:none;width:92%}
#banner small{display:block;font-size:clamp(16px,4.2vmin,40px);letter-spacing:.3em;color:#ffe066;text-shadow:0 3px 0 #7a2a00,0 0 18px rgba(0,0,0,.6);margin-bottom:.4em}
#banner h1{text-wrap:balance;margin:0;font-weight:400;font-size:clamp(40px,15.5vmin,170px);line-height:.96;color:#fff;-webkit-text-stroke:clamp(3px,.7vmin,9px) #b3121c;paint-order:stroke fill;text-shadow:0 .06em 0 #5a0a10,0 .12em 0 #3c060a,0 14px 30px rgba(0,0,0,.55)}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-size:clamp(22px,5vmin,44px);text-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap}
.pop.good{color:#7dff7d;-webkit-text-stroke:2px #0b4d0b;paint-order:stroke fill}
.pop.bad{color:#ff6b6b;-webkit-text-stroke:2px #4d0b0b;paint-order:stroke fill}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,8,20,.2),rgba(10,8,20,.62));padding:16px}
.card{text-align:center;max-width:min(560px,94vw)}
.card small{display:block;color:#ffe066;letter-spacing:.22em;font-size:clamp(11px,2.6vmin,20px);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.card h1{margin:.2em 0 .3em;font-weight:400;font-size:clamp(34px,12vmin,110px);line-height:.95;-webkit-text-stroke:clamp(2px,.55vmin,7px) #b3121c;paint-order:stroke fill;text-shadow:0 .06em 0 #5a0a10,0 .13em 0 #3c060a,0 16px 34px rgba(0,0,0,.6)}
.card h2{margin:.2em 0;font-weight:400;font-size:clamp(22px,6vmin,46px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.card h2.red{color:#ff5a5a;font-size:clamp(34px,10vmin,76px)}
.card p{margin:.6em 0;font-size:clamp(12px,2.6vmin,19px);line-height:1.35;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.card p b{color:#ffe066;font-weight:400}.card .gold{color:#ffe066}
.rows{background:rgba(18,16,28,.66);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 16px;margin:12px 0}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:clamp(13px,2.8vmin,20px);border-bottom:1px solid rgba(255,255,255,.1)}
.rows div:last-child{border:0}.rows b{color:#ffe066;font-weight:400}.rows .tot{font-size:clamp(18px,4vmin,30px)}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}.stars svg{width:clamp(34px,8vmin,58px);fill:#3a3a48;stroke:#777;stroke-width:1}.stars svg.on{fill:#ffd23f;stroke:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.btn{font-family:inherit;font-size:clamp(18px,4.6vmin,32px);color:#fff;background:linear-gradient(#ff5a3c,#c1121f);border:3px solid #fff;border-radius:16px;padding:.5em 1.1em;cursor:pointer;box-shadow:0 6px 0 #6a0a12,0 14px 24px rgba(0,0,0,.45);margin-top:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6a0a12}
.panel.fin{align-items:flex-start;padding-top:2.5vh;background:linear-gradient(rgba(10,8,20,.55),rgba(10,8,20,0) 70%)}
.card.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;align-items:center;max-width:min(900px,96vw);background:rgba(14,12,26,.62);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:12px 20px}
.card.two .rows{margin:0;background:none;border:0;padding:0}.card.two .rows div{padding:4px 0}.card.two .rec{font-size:clamp(11px,2.3vmin,16px);color:#ffe066}
.card.two h2{font-size:clamp(17px,4.2vmin,34px)}
body.portrait .card.two{grid-template-columns:1fr}
.nm{display:block;margin:10px auto 4px;width:min(340px,86%);font-family:inherit;font-size:clamp(16px,3.8vmin,26px);text-align:center;color:#fff;background:rgba(18,16,28,.7);border:3px solid #ffe066;border-radius:14px;padding:.45em .6em;outline:none;text-transform:uppercase}
.nm::placeholder{color:rgba(255,255,255,.45)}.nm.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.ghost{background:rgba(18,16,28,.7);box-shadow:0 6px 0 #000,0 14px 24px rgba(0,0,0,.4);margin-left:6px}
table.lb{width:100%;border-collapse:collapse;font-size:clamp(11px,2.5vmin,18px)}table.lb td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
table.lb td:first-child{color:#ffe066;width:2ch}table.lb td:nth-child(3){color:#9fb3c8;text-align:center}table.lb td:last-child{color:#ffe066;text-align:right}
table.lb tr.me td{background:rgba(255,224,102,.18)}.dim{opacity:.7;font-size:clamp(10px,2.2vmin,14px)!important}
.rows #lbBox{display:block;border:0;padding:0}.rows #lbBox p{margin:.2em 0}
.rows h3{margin:0 0 4px;font-weight:400;font-size:clamp(13px,3vmin,22px);color:#ffe066}
.panel{overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;justify-content:flex-start}
.panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}.panel.fin>:first-child{margin-top:0}
#pz{position:absolute;right:14px;top:calc(clamp(40px,7vmin,56px) + 14px);width:clamp(38px,7.5vmin,52px);height:clamp(38px,7.5vmin,52px);border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(18,16,28,.62);display:flex;align-items:center;justify-content:center;gap:22%;padding:0;cursor:pointer;backdrop-filter:blur(3px)}
#mu{position:absolute;right:14px;top:calc(clamp(40px,7vmin,56px) + 14px + clamp(38px,7.5vmin,52px) + 8px);width:clamp(38px,7.5vmin,52px);height:clamp(38px,7.5vmin,52px);border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(18,16,28,.62);display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;backdrop-filter:blur(3px)}
#mu svg{width:100%;height:100%;fill:#fff}#mu .x{display:none}#mu.off .x{display:block}#mu.off .w{display:none}
#pz i{width:12%;height:42%;background:#fff;border-radius:2px}
.cross{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto 0;max-width:min(920px,96vw)}
.crossBtn{flex:1 1 200px;max-width:300px;text-decoration:none;color:#fff;background:linear-gradient(#d84a3a,#b8322a);border:2px solid #ffd54f;border-radius:12px;box-shadow:0 3px 0 #7d1f1a;padding:7px 10px;text-align:center;line-height:1.3}
.crossBtn.one{flex:0 1 480px;max-width:min(480px,92%)}
.crossBtn b{display:block;font-weight:400;color:#ffd54f;font-size:clamp(11px,2.5vmin,17px)}
.crossBtn span{display:block;font-size:clamp(9px,1.9vmin,13px);margin-top:3px;opacity:.95}
.credits{margin:12px auto 4px;text-align:center;font-size:clamp(9px,1.9vmin,13px);line-height:1.5;color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000;max-width:min(920px,96vw)}
.credits sup{font-size:.6em}.credits .ver{opacity:.6}
.credits .promo{display:table;margin:0 auto 6px;padding:5px 12px;border-radius:10px;background:rgba(10,6,24,.7);border:1px solid rgba(255,213,79,.6);color:#fff;font-weight:700}
.credits a{color:#ffd54f;text-decoration:underline}.credits b{color:#fff;font-weight:400}
.card h1{white-space:nowrap}
.pulse{animation:pl 1.1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.06)}}

#rot{display:none;position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#ffe066;text-shadow:0 2px 0 #000;pointer-events:none}

.card h1 sup{font-size:.3em;-webkit-text-stroke:0;vertical-align:super;text-shadow:0 2px 0 #000}
.card h1{font-size:clamp(34px,13vmin,120px);-webkit-text-stroke-color:#1b6a33;text-shadow:0 .06em 0 #0e3d1c,0 .13em 0 #072410,0 16px 34px rgba(0,0,0,.6)}
.tcard{background:rgba(14,12,26,.5);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 18px;backdrop-filter:blur(2px)}
.diffs{display:flex;gap:8px;justify-content:center;margin:10px 0 8px}
.dbtn{flex:1;max-width:160px;font-family:inherit;font-size:clamp(11px,2.9vmin,19px);color:#fff;background:rgba(18,16,28,.72);border:3px solid rgba(255,255,255,.3);border-radius:14px;padding:.55em .2em;cursor:pointer}
.dbtn i{display:block;font-style:normal;font-size:.62em;opacity:.75;margin-top:2px}
.dbtn.on{background:linear-gradient(#35b558,#1b7a37);border-color:#ffe066;box-shadow:0 4px 0 #0e4a20}
.btns.col{flex-direction:column;align-items:center}.btns.col .btn{margin-left:0;min-width:240px}
#hud{flex-wrap:nowrap}
#hud .pill{padding:4px 12px}
#prog{min-width:40px}#progFill{background:linear-gradient(90deg,#35b558,#ffe066)}
#prog i{display:none}
#banner{top:26%;transform:translateX(-50%)}
#banner.in{animation:bn .45s cubic-bezier(.2,1.6,.4,1)}@keyframes bn{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#banner h1{font-size:clamp(30px,11vmin,120px);-webkit-text-stroke-color:#1b6a33;text-shadow:0 .06em 0 #0e3d1c,0 .12em 0 #072410,0 14px 30px rgba(0,0,0,.55)}

.pop{transform:translate(-50%,-50%);animation:pp 1.1s ease-out forwards}@keyframes pp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.pop.life{color:#ffe066;-webkit-text-stroke:2px #7a2a00;paint-order:stroke fill;font-size:clamp(28px,7vmin,60px)}
.pop.bad{font-size:clamp(16px,4vmin,34px)}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,30,30,.55));opacity:0}
#flash.on{animation:fl .5s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
#scr.panel.title{background:radial-gradient(ellipse at center,rgba(10,8,20,.1),rgba(10,8,20,.5))}
table.lb td:nth-child(3){font-size:.8em;white-space:nowrap}
body.portrait #hud{gap:6px;padding-left:8px;padding-right:8px}
